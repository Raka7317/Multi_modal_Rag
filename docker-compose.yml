version: "3.9"
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OPENSEARCH_HOST=opensearch
      - MONGODB_URI=mongodb://mongo:27017
    depends_on:
      - opensearch
      - mongo

  opensearch:
    image: opensearchproject/opensearch:2.17.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
